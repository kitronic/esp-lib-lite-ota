name: Tests & Build Check

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  native-tests:
    name: Native (${{ matrix.cxx }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cxx: [g++, clang++]
        exclude:
          - os: ubuntu-latest
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Show compiler version
        run: ${{ matrix.cxx }} --version

      - name: Build tests
        env:
          CXX: ${{ matrix.cxx }}
        run: make -C test/native build

      - name: Run tests
        env:
          CXX: ${{ matrix.cxx }}
        run: make -C test/native run

  esp8266-build:
    name: ESP8266 Compile Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: Basic
            flags: ""
          - example: WebUpdate
            flags: "-DLITEOTA_USE_WEB=1"
          - example: SafeRollback
            flags: "-DLITEOTA_USE_ROLLBACK=1"
          - example: HTTPS-MixedMode
            flags: "-DLITEOTA_USE_TLS=1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install ESP8266 platform
        run: pio platform install espressif8266

      - name: Compile ${{ matrix.example }}
        run: |
          pio ci \
            --board=d1_mini \
            --lib=. \
            --project-option="lib_deps=bblanchon/ArduinoJson@^6.19.0" \
            --project-option="build_flags=${{ matrix.flags }}" \
            --project-option="monitor_speed=115200" \
            examples/${{ matrix.example }}