name=LiteOTA
version=1.0.0
author=Kitronic
maintainer=Kitronic <info@kitronic.tech>
sentence=Ultra-lightweight non-blocking OTA updater for ESP8266 with JSON/plain-text manifest support and optional HTTPS.
paragraph=State-machine driven, tick()-based OTA updater. Zero String usage, minimal heap footprint. Supports JSON and plain-text manifests with auto-detection. Optional HTTPS with MFLN buffer tuning (~2KB TLS RAM). Works alongside Web server and MQTT without blocking the main loop. Ideal for Wemos D1 mini / D1 R2.
category=Communication
url=https://github.com/kitronic/esp-lib-lite-ota
architectures=esp8266
depends=ArduinoJson
includes=LiteOTA.h